
name: LAB11 Project16 Azure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          pwd
          ls -la
          ls -la scripts/
          ls -la infrastructure/
          ls -la application/
          test -f infrastructure/main.bicep
          test -f scripts/deploy.sh
          test -f scripts/deploy-app.sh

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Prepare scripts
        run: |
          chmod +x scripts/*.sh

      - name: Validate Bicep
        run: |
          bash scripts/validate.sh "${{ inputs.environment }}"

      - name: Deploy Azure Infrastructure
        env:
          LOCATION: centralindia
          AUTO_APPROVE: "true"
        run: |
          bash scripts/deploy.sh "${{ inputs.environment }}"

      - name: Deploy Application
        run: |
          bash scripts/deploy-app.sh "${{ inputs.environment }}"

      - name: Verify Deployment
        run: |
          bash scripts/verify.sh "${{ inputs.environment }}"
